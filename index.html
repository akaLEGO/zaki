<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Kaff — Be the Upper Hand</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0D3B2E" />
<meta name="description" content="Kaff — Be the Upper Hand. Islamic Finance OS for Thai Muslims." />
<meta property="og:title" content="Kaff — Be the Upper Hand" />
<meta property="og:description" content="Give with dignity. Riba · Zakat · Wajib · Qurban · Sadaqah — in one app." />
<meta property="og:type" content="website" />
<link rel="icon" type="image/svg+xml" href="/kaff-favicon.svg" />
<link rel="apple-touch-icon" href="/kaff-app-icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #F5F1E8;
    /* Manrope for Latin, Sarabun for Thai (auto-fallback), Arabic font for ك */
    font-family: 'Manrope', 'Sarabun', 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;
    color: #0E1A14;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; color: inherit; }
  input { font-family: inherit; }

  :root {
    --forest: #2A6041;
    --forest-deep: #0E1A14;
    --sage: #2EC27E;
    --sage-soft: #E6EDE8;
    --gold: #D4AF37;
    --gold-soft: #F4E4B7;
    --surface: #F5F1E8;
    --paper: #FFFFFF;
    --ink: #0E1A14;
    --muted: #6B6B6B;
    --line: #E6DFCF;
  }

  .stage {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 48px 24px;
    background: radial-gradient(1200px 700px at 20% 0%, #EFE9D9 0%, #F5F1E8 60%, #E8E3D2 100%);
  }
  .wrap {
    display: flex; gap: 64px; align-items: center;
    flex-wrap: wrap; justify-content: center;
  }
  .credits {
    max-width: 320px;
    font-family: 'Manrope', system-ui, sans-serif;
    color: #2c3a32;
  }
  .credits .logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 22px; letter-spacing: -0.04em;
  }
  .credits .logo .dot {
    width: 30px; height: 30px; border-radius: 9px; background: var(--forest);
    color: var(--gold); display:flex; align-items:center; justify-content:center;
    font-family: 'IBM Plex Sans Arabic', 'Cairo', sans-serif; font-weight: 500; font-size: 22px;
  }
  .credits h1 {
    font-size: 38px; line-height: 1.1; letter-spacing: -0.02em;
    margin: 18px 0 8px; font-weight: 800; color: var(--forest);
  }
  .credits .tag { font-size: 15px; color: #475a4e; margin: 0 0 28px; }
  .credits .meta {
    display: grid; grid-template-columns: auto 1fr; gap: 6px 14px;
    font-size: 13px; color: #475a4e;
  }
  .credits .meta b { color: var(--forest); font-weight: 600; }

  .swatchrow { display:flex; gap: 8px; margin: 18px 0 24px; }
  .swatchrow .s {
    width: 36px; height: 36px; border-radius: 10px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
  }

  .screen-buttons {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
    margin-top: 22px;
  }
  .screen-buttons button {
    text-align: left; padding: 8px 10px; border-radius: 8px;
    background: rgba(255,255,255,0.5); border: 1px solid rgba(42,96,65,0.12);
    font-size: 12px; color: var(--forest); cursor: pointer;
    font-family: 'Manrope', system-ui;
    transition: all .15s;
  }
  .screen-buttons button:hover { background: var(--forest); color: var(--gold); }
  .screen-buttons button.active { background: var(--forest); color: var(--gold); border-color: var(--forest); }

  @media (max-width: 900px) {
    .credits { display: none; }
    .stage { padding: 20px 0; }
  }

  /* Full-screen production mode — no iPhone frame, no design panel */
  .app-fullscreen {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    background: #0D3B2E;
    display: flex;
    justify-content: center;
  }
  .app-fullscreen > .app-canvas {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    background: #F5F1E8;
    position: relative;
    overflow-x: hidden;
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/consumer/main.tsx"></script>
</body>
</html>
