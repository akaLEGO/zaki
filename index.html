<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Kaff — Be the Upper Hand</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0D3B2E" />
<meta name="description" content="Kaff — Be the Upper Hand. Islamic Finance OS for Thai Muslims." />
<meta property="og:title" content="Kaff — Be the Upper Hand" />
<meta property="og:description" content="Give with dignity. Riba · Zakat · Wajib · Qurban · Sadaqah — in one app." />
<meta property="og:type" content="website" />
<link rel="icon" type="image/svg+xml" href="/kaff-favicon.svg" />
<link rel="apple-touch-icon" href="/kaff-app-icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #0D3B2E;
    /* IBM Plex Sans Thai for Thai + UI, Space Grotesk for numerals/labels
       (applied per-element via the NUM token), Arabic font for ك */
    font-family: 'IBM Plex Sans Thai', 'Space Grotesk', 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;
    color: #0D3B2E;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; color: inherit; }
  input { font-family: inherit; }

  :root {
    --forest: #0D3B2E;
    --forest-deep: #061A14;
    --sage: #2C7D53;
    --sage-soft: #E6EFE9;
    --gold: #C9A227;
    --gold-soft: #EBD79A;
    --lime: #B9F27C;
    --lime-tint: #DCFFB0;
    --olive: #8A7538;
    --surface: #F3F7F4;
    --paper: #FFFFFF;
    --ink: #0D3B2E;
    --muted: #4d7a68;
    --line: #DCE8E0;
    --paper-green: linear-gradient(200deg,#F3F7F4 0%,#E6EFE9 45%,#CFE3D6 100%);
    --paper-gold: linear-gradient(200deg,#FBF7EC 0%,#F0E9D6 45%,#DED5B8 100%);
  }

  /* Shared motion for the state primitives in KaffUI (Spinner / Skeleton /
     check badges). Defined once globally so no screen re-declares them. */
  @keyframes kaffSpin { to { transform: rotate(360deg); } }
  @keyframes kaffShimmer {
    0%   { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }
  @keyframes kaffPop {
    from { transform: scale(0.6); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }

  .stage {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 48px 24px;
    background: radial-gradient(1200px 700px at 20% 0%, #EFE9D9 0%, #F5F1E8 60%, #E8E3D2 100%);
  }
  .wrap {
    display: flex; gap: 64px; align-items: center;
    flex-wrap: wrap; justify-content: center;
  }
  .credits {
    max-width: 320px;
    font-family: 'Manrope', system-ui, sans-serif;
    color: #2c3a32;
  }
  .credits .logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 22px; letter-spacing: -0.04em;
  }
  .credits .logo .dot {
    width: 30px; height: 30px; border-radius: 9px; background: var(--forest);
    color: var(--gold); display:flex; align-items:center; justify-content:center;
    font-family: 'IBM Plex Sans Arabic', 'Cairo', sans-serif; font-weight: 500; font-size: 22px;
  }
  .credits h1 {
    font-size: 38px; line-height: 1.1; letter-spacing: -0.02em;
    margin: 18px 0 8px; font-weight: 800; color: var(--forest);
  }
  .credits .tag { font-size: 15px; color: #475a4e; margin: 0 0 28px; }
  .credits .meta {
    display: grid; grid-template-columns: auto 1fr; gap: 6px 14px;
    font-size: 13px; color: #475a4e;
  }
  .credits .meta b { color: var(--forest); font-weight: 600; }

  .swatchrow { display:flex; gap: 8px; margin: 18px 0 24px; }
  .swatchrow .s {
    width: 36px; height: 36px; border-radius: 10px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
  }

  .screen-buttons {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
    margin-top: 22px;
  }
  .screen-buttons button {
    text-align: left; padding: 8px 10px; border-radius: 8px;
    background: rgba(255,255,255,0.5); border: 1px solid rgba(42,96,65,0.12);
    font-size: 12px; color: var(--forest); cursor: pointer;
    font-family: 'Manrope', system-ui;
    transition: all .15s;
  }
  .screen-buttons button:hover { background: var(--forest); color: var(--gold); }
  .screen-buttons button.active { background: var(--forest); color: var(--gold); border-color: var(--forest); }

  @media (max-width: 900px) {
    .credits { display: none; }
    .stage { padding: 20px 0; }
  }

  /* Full-screen production mode — no iPhone frame, no design panel */
  .app-fullscreen {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    background: #0D3B2E;
    display: flex;
    justify-content: center;
  }
  /* Fixed-height shell: each screen is `height: 100%` with its own internal
     scroller, so sticky CTAs and the tab bar stay pinned to the viewport
     instead of being pushed below the fold by long content. */
  .app-fullscreen > .app-canvas {
    width: 100%;
    max-width: 480px;
    height: 100%;
    background: var(--paper-green);
    position: relative;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/consumer/main.tsx"></script>
</body>
</html>
