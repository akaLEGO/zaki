<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Kaff — Be the Upper Hand</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #E9EFEA;
    font-family: 'Sarabun', 'Inter', system-ui, -apple-system, sans-serif;
    color: #0A0A0A;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; color: inherit; }
  input { font-family: inherit; }

  :root {
    --forest: #0D3B2E;
    --forest-deep: #082A21;
    --sage: #2EC27E;
    --sage-soft: #DCF0E5;
    --gold: #C9A94A;
    --gold-soft: #F5EDD3;
    --surface: #F5F8F5;
    --paper: #FFFFFF;
    --ink: #0A0A0A;
    --muted: #6B7280;
    --line: #E6ECE7;
  }

  .stage {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 48px 24px;
    background: radial-gradient(1200px 700px at 20% 0%, #DDE8DE 0%, #E9EFEA 60%, #E2EAE3 100%);
  }
  .wrap {
    display: flex; gap: 64px; align-items: center;
    flex-wrap: wrap; justify-content: center;
  }
  .credits {
    max-width: 320px;
    font-family: 'Inter', system-ui, sans-serif;
    color: #2c3a32;
  }
  .credits .logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 22px; letter-spacing: -0.01em;
  }
  .credits .logo .dot {
    width: 30px; height: 30px; border-radius: 9px; background: var(--forest);
    color: var(--gold); display:flex; align-items:center; justify-content:center;
    font-family: 'Sarabun'; font-weight: 800; font-size: 18px;
  }
  .credits h1 {
    font-size: 38px; line-height: 1.1; letter-spacing: -0.02em;
    margin: 18px 0 8px; font-weight: 800; color: var(--forest);
  }
  .credits .tag { font-size: 15px; color: #475a4e; margin: 0 0 28px; }
  .credits .meta {
    display: grid; grid-template-columns: auto 1fr; gap: 6px 14px;
    font-size: 13px; color: #475a4e;
  }
  .credits .meta b { color: var(--forest); font-weight: 600; }

  .swatchrow { display:flex; gap: 8px; margin: 18px 0 24px; }
  .swatchrow .s {
    width: 36px; height: 36px; border-radius: 10px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
  }

  .screen-buttons {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
    margin-top: 22px;
  }
  .screen-buttons button {
    text-align: left; padding: 8px 10px; border-radius: 8px;
    background: rgba(255,255,255,0.5); border: 1px solid rgba(13,59,46,0.08);
    font-size: 12px; color: var(--forest); cursor: pointer;
    font-family: 'Inter', system-ui;
    transition: all .15s;
  }
  .screen-buttons button:hover { background: var(--forest); color: var(--gold); }
  .screen-buttons button.active { background: var(--forest); color: var(--gold); border-color: var(--forest); }

  @media (max-width: 900px) {
    .credits { display: none; }
    .stage { padding: 20px 0; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/consumer/main.tsx"></script>
</body>
</html>
