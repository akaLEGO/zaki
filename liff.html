<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Kaff — บริจาคใน LINE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D3B2E" />
<meta name="description" content="Kaff — Be the Upper Hand. Islamic Finance OS for Thai Muslims." />
<link rel="icon" type="image/svg+xml" href="/kaff-favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #0D3B2E;
    font-family: 'IBM Plex Sans Thai', 'Space Grotesk', 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;
    color: #0D3B2E;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; color: inherit; }
  input { font-family: inherit; }

  /* Kept in sync with index.html — the LIFF entry mounts the same consumer
     App, so it needs the same tokens and the same state-primitive motion. */
  :root {
    --forest: #0D3B2E;
    --lime: #B9F27C;
    --gold: #C9A227;
    --paper-green: linear-gradient(200deg,#F3F7F4 0%,#E6EFE9 45%,#CFE3D6 100%);
  }
  @keyframes kaffSpin { to { transform: rotate(360deg); } }
  @keyframes kaffShimmer {
    0%   { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }
  @keyframes kaffPop {
    from { transform: scale(0.6); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }

  /* LIFF runs inside the LINE app, so we always want full-screen — no
     "design preview" mode, no iPhone frame. The .app-canvas is bounded to
     480px so it still looks ok if someone opens the LIFF URL on desktop. */
  .liff-stage {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    background: #0D3B2E;
    display: flex;
    justify-content: center;
  }
  .liff-stage > .app-canvas {
    width: 100%;
    max-width: 480px;
    height: 100%;
    background: var(--paper-green);
    position: relative;
    overflow: hidden;
  }

  /* Loading splash while LIFF SDK initializes. */
  .liff-splash {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    background: linear-gradient(180deg,#061A14 0%,#08231B 45%,#0D3B2E 100%); color: #f2fbf5;
    font-family: 'IBM Plex Sans Thai', system-ui, sans-serif;
  }
  .liff-splash .glyph {
    width: 60px; height: 60px; border-radius: 18px;
    background: #B9F27C; color: #0D3B2E;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 38px; font-weight: 600;
  }
  .liff-splash .label { font-size: 13px; color: rgba(255,255,255,0.7); letter-spacing: 0.06em; }
</style>
</head>
<body>
  <div id="root">
    <div class="liff-splash">
      <div class="glyph">ك</div>
      <div class="label">กำลังเชื่อมต่อ LINE…</div>
      <div style="position:absolute;bottom:18px;font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:0.08em;">Kaff · Beta</div>
    </div>
  </div>
  <script type="module" src="/src/liff/main.tsx"></script>
</body>
</html>
